<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Mastery: Guided Tracing & Compounds</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500;600&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<!-- HanziWriter Library for Guided Stroke Order -->
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    :root {
        --bg-color: #0c0c0e;
        --panel-bg: #151518;
        --card-bg: #1a1a22;
        --card-hover: #22222c;
        --text-main: #f5f5f5;
        --text-muted: #888892;
        --red-accent: #e53935;
        --red-hover: #ff6161;
        --green-correct: #4caf50;
        --gray-border: #2e2e38;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    header {
        width: 100%;
        background-color: var(--panel-bg);
        padding: 20px 15px;
        text-align: center;
        border-bottom: 2px solid var(--red-accent);
    }

    h1, h2, h3 { margin: 0; padding: 0; }
    h1 { color: var(--text-main); margin-bottom: 15px; font-weight: 600; letter-spacing: 1px; }
    h1 span { color: var(--red-accent); }

    .controls {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    select, button {
        background-color: #22222a;
        color: white;
        border: 1px solid var(--gray-border);
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        outline: none;
        transition: all 0.2s;
    }

    select {
        max-width: 90vw;
    }

    button {
        background-color: var(--red-accent);
        font-weight: 600;
        border: none;
    }

    button:hover { background-color: var(--red-hover); transform: translateY(-1px); }
    button:disabled { background-color: #444; cursor: not-allowed; transform: none; color: #888; }

    .mode-switch { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
    .mode-btn { background-color: #26262e; border: 1px solid #363642; color: #aaa; }
    .mode-btn.active { background-color: var(--red-accent); color: white; border-color: var(--red-accent); }

    .container {
        width: 92%;
        max-width: 550px;
        background-color: var(--panel-bg);
        margin-top: 25px;
        margin-bottom: 40px;
        padding: 28px 22px;
        border-radius: 12px;
        border: 1px solid #24242c;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        display: none; 
        flex-direction: column;
        align-items: center;
    }

    .container.active { display: flex; }

    /* Stepper Navigation Pills for Kanji & its Compound Words */
    .practice-stepper {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
    }

    .step-pill {
        background: #1e1e26;
        color: #8e8e9c;
        border: 1px solid #2e2e3a;
        padding: 5px 11px;
        border-radius: 16px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
        display: flex;
        align-items: center;
        gap: 4px;
        font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
    }

    .step-pill:hover {
        background: #282834;
        color: #ddd;
        border-color: #444456;
    }

    .step-pill.active {
        background: var(--red-accent);
        color: white;
        border-color: var(--red-accent);
        font-weight: 600;
        box-shadow: 0 0 10px rgba(229, 57, 53, 0.4);
    }

    .step-pill.done:not(.active) {
        border-color: #3b5e40;
        color: #b0e0b3;
    }

    .step-pill.done::after {
        content: " ✓";
        font-size: 10px;
        color: #81c784;
    }

    /* Display Header */
    .kanji-display {
        font-family: 'Shippori Mincho', 'Noto Serif JP', 'Yu Mincho', serif;
        font-weight: 400;
        font-size: clamp(44px, 10vw, 72px);
        margin: 6px 0 14px 0;
        text-shadow: 0 0 20px rgba(255,255,255,0.06);
        line-height: 1.25;
        text-align: center;
    }

    ruby { ruby-align: center; }
    
    rt {
        font-family: 'Segoe UI', Meiryo, sans-serif;
        font-size: 18px;
        color: var(--text-muted);
        font-weight: 400;
        transform: translateY(-4px);
    }

    .meanings-display {
        color: var(--red-accent);
        font-size: 20px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 16px;
        letter-spacing: 0.5px;
    }

    /* Guided Drawing Canvas Styles (Single for Base Kanji, Dual for 2-Kanji Compounds) */
    .canvas-stage {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 10px;
    }

    .single-canvas-container {
        position: relative;
        background-color: #09090c;
        border: 1px solid #2e2e38;
        border-radius: 8px;
        box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        width: 290px;
        height: 290px;
        max-width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .dual-canvas-container {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

    .char-box {
        position: relative;
        background-color: #09090c;
        border: 1px solid #2e2e38;
        border-radius: 8px;
        box-shadow: inset 0 0 16px rgba(0,0,0,0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        transition: border-color 0.25s, box-shadow 0.25s;
    }

    .char-box.completed {
        border-color: var(--green-correct);
        box-shadow: 0 0 12px rgba(76, 175, 80, 0.25), inset 0 0 16px rgba(0,0,0,0.6);
    }

    .writer-target {
        width: 100%;
        height: 100%;
        cursor: pointer;
        touch-action: none;
    }

    .canvas-label {
        position: absolute;
        bottom: -22px;
        width: 100%;
        text-align: center;
        color: #555562;
        font-size: 11px;
        letter-spacing: 1.5px;
        pointer-events: none;
        font-weight: 600;
    }

    .trace-status-banner {
        min-height: 22px;
        font-size: 13.5px;
        font-weight: 600;
        text-align: center;
        margin-top: 18px;
        color: var(--text-muted);
    }

    .trace-status-banner.success {
        color: var(--green-correct);
    }

    .draw-controls {
        margin-top: 15px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
    }

    .draw-controls button {
        padding: 9px 15px;
        font-size: 14px;
    }

    /* Compound Words Box (Practice Mode) */
    .compounds-section {
        width: 100%;
        margin-top: 24px;
        background: #0e0e12;
        border: 1px solid #23232c;
        border-radius: 10px;
        padding: 16px 18px;
    }

    .compounds-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #202028;
    }

    .compounds-header span {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-muted);
    }

    .compounds-grid {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
    }

    .compound-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        border: 1px solid var(--gray-border);
        border-radius: 8px;
        padding: 10px 14px;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .compound-card:hover {
        background: var(--card-hover);
        border-color: #444455;
    }

    .compound-card.active-compound {
        border-color: var(--red-accent);
        background: #25181a;
        box-shadow: 0 0 10px rgba(229, 57, 53, 0.25);
    }

    .compound-word-wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .compound-badge {
        font-size: 10.5px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #2b2b36;
        color: #aaa;
    }

    .compound-card.active-compound .compound-badge {
        background: var(--red-accent);
        color: white;
    }

    .compound-word {
        font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
        font-size: 20px;
        font-weight: 500;
        color: #ffffff;
        line-height: 1.3;
    }

    .compound-word rt {
        font-family: 'Segoe UI', Meiryo, sans-serif;
        font-size: 11px;
        color: #9a9ab0;
    }

    .compound-meaning {
        font-size: 13.5px;
        color: #c4c4cc;
        text-align: right;
        max-width: 52%;
        font-weight: 400;
    }

    /* MCQ & Test Options */
    .mcq-options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        margin: 20px 0;
    }

    .mcq-option {
        background: var(--card-bg);
        padding: 14px 16px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        border: 1px solid var(--gray-border);
        transition: background 0.2s, border-color 0.2s;
        user-select: none;
    }

    .mcq-option:hover {
        background: var(--card-hover);
        border-color: #4a4a58;
    }

    .mcq-option.selected {
        border-color: var(--red-accent);
        background: #251b20;
    }

    .mcq-option.correct-highlight {
        background: #112816 !important;
        border-color: var(--green-correct) !important;
    }

    .mcq-option.incorrect-highlight {
        background: #331416 !important;
        border-color: var(--red-accent) !important;
    }
    
    input[type="radio"] {
        width: 20px;
        height: 20px;
        accent-color: var(--red-accent);
        cursor: pointer;
        flex-shrink: 0;
    }

    .feedback {
        margin: 12px 0;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        min-height: 25px;
    }
    .correct { color: var(--green-correct); }
    .incorrect { color: var(--red-accent); }
    .progress {
        color: var(--text-muted);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }
    
    .instruction-text {
        text-align: center;
        color: #aaaab4;
        font-size: 14px;
        margin-top: -6px;
        margin-bottom: 12px;
    }

    @media (max-width: 480px) {
        .container {
            padding: 20px 14px;
            width: 95%;
        }
        .compound-card {
            padding: 8px 10px;
        }
        .compound-word {
            font-size: 18px;
        }
        .compound-meaning {
            font-size: 12.5px;
        }
        .step-pill {
            padding: 4px 8px;
            font-size: 11px;
        }
    }
</style>
</head>
<body>

<header>
    <h1>Kanji<span>Mastery</span></h1>
    <div class="controls">
        <select id="categorySelect" onchange="loadCategory(this.value)">
            <option value="1">1. Numbers, Time & Days</option>
            <option value="2">2. Nature, Weather & Geography</option>
            <option value="3">3. People, Family & Body Parts</option>
            <option value="4">4. Animals, Colors & Qualities</option>
            <option value="5">5. Physical Actions & Movement</option>
            <option value="6">6. Mental Actions & Transactions</option>
            <option value="7">7. Places, Buildings, City</option>
            <option value="8">8. Home, Daily Life & Food</option>
            <option value="9">9. Society, Gov, Law & Work</option>
            <option value="10">10. Abstract Concepts & Degrees</option>
            <option value="11">11. Perception, Emotion, Status</option>
            <option value="12">12. Measurement, Systems & Infra</option>
            <option value="13">13. Core Terminology & Media</option>
        </select>
        <button onclick="startRandomTest()">Start 20-Word Test</button>
    </div>
    <div class="mode-switch">
        <button id="btnPractice" class="mode-btn active" onclick="setMode('practice')">Practice (Trace)</button>
        <button id="btnMCQ" class="mode-btn" onclick="setMode('mcq')">MCQ Quiz</button>
    </div>
</header>

<!-- Practice Mode -->
<div id="practiceMode" class="container active">
    <div id="pracProgress" class="progress">Kanji 1 / 50 • Base Character</div>
    
    <!-- Stepper Navigation Pills -->
    <div id="pracStepper" class="practice-stepper"></div>

    <!-- Furigana and Display -->
    <ruby style="margin-bottom: 5px;">
        <span id="pracDisplayChar" style="display:none;"></span>
        <rt id="pracFurigana" style="font-size:26px;">いち</rt>
    </ruby>
    <div id="pracMeanings" class="meanings-display">One</div>
    
    <!-- Guided Tracing Canvas Stage (Swaps between 1 canvas for base kanji and 2 canvases for 2-kanji compounds) -->
    <div id="pracCanvasStage" class="canvas-stage"></div>

    <div id="pracStatusBanner" class="trace-status-banner">Trace stroke order in the box above</div>
    
    <div class="draw-controls">
        <button id="btnPrev" style="background-color: #272732;" onclick="prevPractice()">◀ Prev</button>
        <button style="background-color: #383848;" onclick="animateStrokeOrder()">Animate Strokes</button>
        <button id="btnNext" onclick="nextPractice()">Next ➔</button>
    </div>

    <!-- 4-5 Compound Words Container Directly Under Tracing Canvas -->
    <div class="compounds-section">
        <div class="compounds-header">
            <span>Common Compounds (熟語)</span>
            <span style="font-size:11px; text-transform:none; color:#777;">Click to practice</span>
        </div>
        <div id="pracCompoundsList" class="compounds-grid"></div>
    </div>
</div>

<!-- MCQ Mode -->
<div id="mcqMode" class="container">
    <div id="mcqProgress" class="progress">Kanji 1 / 50</div>
    <div class="kanji-display">
        <ruby><span id="mcqKanji">一日</span><rt id="mcqFurigana">いちにち</rt></ruby>
    </div>
    <p class="instruction-text">Select the correct meaning for this compound word:</p>
    
    <div id="mcqOptions" class="mcq-options"></div>
    <div id="mcqFeedback" class="feedback"></div>
    <button id="mcqSubmitBtn" onclick="checkMCQ()" style="width:100%; padding: 15px; font-size: 16px;">Check Answer</button>
</div>

<!-- Test Mode -->
<div id="testMode" class="container">
    <h2 style="color:var(--red-accent); margin-bottom: 10px; font-weight: 600;">Randomized 20-Word Test</h2>
    <div id="testProgress" class="progress">Question 1 / 20</div>
    <div class="kanji-display">
        <ruby><span id="testKanji">一日</span><rt id="testFurigana">いちにち</rt></ruby>
    </div>
    <p class="instruction-text">Select the correct meaning for this compound word:</p>
    
    <div id="testOptions" class="mcq-options"></div>
    <div id="testFeedback" class="feedback"></div>
    <button id="testSubmitBtn" onclick="checkTest()" style="width:100%; padding: 15px; font-size: 16px;">Submit Answer</button>
</div>

<script>
// Expanded 650 Kanji Database with Verified Furigana and 4-5 Common Compounds (熟語)

// Global State
let kanjiDB = {};
let allKanjiFlat = [];
let allCompoundsPool = [];
let allCompoundMeanings = [];
let currentCategory = 1;
let currentList = [];
let currentIndex = 0;
let currentSubStep = 0; // 0 = Base Kanji, 1..N = Compound words of current kanji

// Completed tracking: completedSubSteps[cat_index_substep] = true
let completedSteps = {};

// HanziWriter instances
let baseWriter = null;
let compWriter1 = null;
let compWriter2 = null;
let compChar1Done = false;
let compChar2Done = false;

// Quiz State
let testScore = 0;
let testQuestions = [];
let mcqCurrentCompound = null;
let mcqState = "answering"; // answering, answered

// Escape HTML utility
function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// Parse Data 
function initDB() {
    allKanjiFlat = [];
    allCompoundsPool = [];
    
    for (let cat = 1; cat <= 13; cat++) {
        kanjiDB[cat] = [];
        let items = rawData[cat].split("|");
        items.forEach(p => {
            let [kanjiPart, compoundsPart] = p.split("@");
            let [char, furigana, meaningsStr] = kanjiPart.split(":");
            let meanings = meaningsStr ? meaningsStr.split(",") : [];
            let compounds = [];
            if (compoundsPart) {
                compoundsPart.split(";").forEach(c => {
                    let [word, reading, meaning] = c.split(":");
                    if (word && reading && meaning) {
                        let compObj = { word, reading, meaning, kanjiChar: char };
                        compounds.push(compObj);
                        allCompoundsPool.push(compObj);
                    }
                });
            }
            let entry = { char, furigana, meanings, compounds, cat };
            kanjiDB[cat].push(entry);
            allKanjiFlat.push(entry);
        });
    }
    allCompoundMeanings = [...new Set(allCompoundsPool.map(c => c.meaning))];
}

// Core Navigation
function setMode(mode) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('practiceMode').classList.remove('active');
    document.getElementById('mcqMode').classList.remove('active');
    document.getElementById('testMode').classList.remove('active');

    if (mode === 'practice') {
        document.getElementById('btnPractice').classList.add('active');
        document.getElementById('practiceMode').classList.add('active');
        renderPractice();
    } else if (mode === 'mcq') {
        document.getElementById('btnMCQ').classList.add('active');
        document.getElementById('mcqMode').classList.add('active');
        renderMCQ();
    }
}

function loadCategory(catId) {
    currentCategory = parseInt(catId);
    currentList = kanjiDB[currentCategory];
    currentIndex = 0;
    currentSubStep = 0;
    setMode('practice');
}

// Calculate responsive canvas sizes
function getSingleCanvasSize() {
    let container = document.getElementById('practiceMode');
    let w = container ? container.clientWidth : 340;
    let available = Math.min(w - 48, 300);
    return Math.max(250, available);
}

function getDualCanvasSize() {
    let container = document.getElementById('practiceMode');
    let w = container ? container.clientWidth : 340;
    let available = Math.min(w - 56, 380);
    let size = Math.floor((available - 14) / 2);
    return Math.max(128, Math.min(size, 175));
}

// Practice Mode Functions with HanziWriter
function renderPractice() {
    if (currentIndex >= currentList.length) currentIndex = 0;
    let item = currentList[currentIndex];
    let numCompounds = (item.compounds && item.compounds.length) || 0;
    
    // Bounds check on currentSubStep
    if (currentSubStep > numCompounds) currentSubStep = 0;

    // Build Stepper Navigation Pills
    let stepperHtml = "";
    let baseKey = `${currentCategory}_${currentIndex}_0`;
    let isBaseDone = !!completedSteps[baseKey];
    stepperHtml += `<div class="step-pill ${currentSubStep === 0 ? 'active' : ''} ${isBaseDone ? 'done' : ''}" onclick="jumpPracticeStep(0)">${item.char} (Base)</div>`;
    
    for (let i = 0; i < numCompounds; i++) {
        let c = item.compounds[i];
        let cKey = `${currentCategory}_${currentIndex}_${i + 1}`;
        let isDone = !!completedSteps[cKey];
        stepperHtml += `<div class="step-pill ${currentSubStep === (i + 1) ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="jumpPracticeStep(${i + 1})">${i + 1}. ${c.word}</div>`;
    }
    document.getElementById("pracStepper").innerHTML = stepperHtml;

    // Clear previous writer instances
    baseWriter = null;
    compWriter1 = null;
    compWriter2 = null;
    compChar1Done = false;
    compChar2Done = false;

    let stage = document.getElementById("pracCanvasStage");
    let banner = document.getElementById("pracStatusBanner");
    let btnPrev = document.getElementById("btnPrev");
    let btnNext = document.getElementById("btnNext");

    btnPrev.disabled = (currentIndex === 0 && currentSubStep === 0);

    if (currentSubStep === 0) {
        // --- BASE KANJI MODE ---
        document.getElementById("pracProgress").innerText = `Kanji ${currentIndex + 1} / ${currentList.length} • Base Character`;
        document.getElementById("pracFurigana").innerText = item.furigana;
        document.getElementById("pracMeanings").innerText = item.meanings.join(", ");
        banner.innerText = `Trace stroke order for "${item.char}"`;
        banner.className = "trace-status-banner";

        btnNext.innerText = `Next: 1. ${item.compounds[0] ? item.compounds[0].word : 'Compound'} ➔`;

        let size = getSingleCanvasSize();
        stage.innerHTML = `
            <div class="single-canvas-container" style="width:${size}px; height:${size}px;">
                <div id="base-writer-target" class="writer-target"></div>
                <div class="canvas-label">TRACE BASE KANJI HERE</div>
            </div>
        `;

        baseWriter = HanziWriter.create('base-writer-target', item.char, {
            width: size,
            height: size,
            padding: 16,
            strokeAnimationSpeed: 1.5,
            delayBetweenStrokes: 100,
            strokeColor: '#333333',
            radicalColor: '#333333',
            highlightColor: '#ff6161',
            outlineColor: '#222222',
            drawingColor: '#e53935',
            drawingWidth: 15,
            showHintAfterMisses: 1,
            showOutline: true
        });

        baseWriter.quiz({
            onComplete: function() {
                completedSteps[baseKey] = true;
                banner.innerText = `Base Kanji "${item.char}" Completed! ✨`;
                banner.className = "trace-status-banner success";
                renderStepperState();
            }
        });

    } else {
        // --- COMPOUND WORD TRACING MODE ---
        let compIdx = currentSubStep - 1;
        let comp = item.compounds[compIdx];

        document.getElementById("pracProgress").innerText = `Kanji ${currentIndex + 1} / ${currentList.length} • Compound ${currentSubStep} / ${numCompounds}`;
        document.getElementById("pracFurigana").innerText = comp.reading;
        document.getElementById("pracMeanings").innerText = comp.meaning;
        banner.innerText = `Trace compound: 1. ${comp.word[0]}  then  2. ${comp.word[1]}`;
        banner.className = "trace-status-banner";

        if (currentSubStep < numCompounds) {
            btnNext.innerText = `Next: ${currentSubStep + 1}. ${item.compounds[currentSubStep].word} ➔`;
        } else {
            btnNext.innerText = `Next Kanji ➔`;
        }

        let cSize = getDualCanvasSize();
        stage.innerHTML = `
            <div class="dual-canvas-container">
                <div id="box-char-1" class="char-box" style="width:${cSize}px; height:${cSize}px;">
                    <div id="comp-writer-target-1" class="writer-target"></div>
                    <div class="canvas-label">1. ${comp.word[0]}</div>
                </div>
                <div id="box-char-2" class="char-box" style="width:${cSize}px; height:${cSize}px;">
                    <div id="comp-writer-target-2" class="writer-target"></div>
                    <div class="canvas-label">2. ${comp.word[1]}</div>
                </div>
            </div>
        `;

        let hwOpts = {
            width: cSize,
            height: cSize,
            padding: 12,
            strokeAnimationSpeed: 1.5,
            delayBetweenStrokes: 90,
            strokeColor: '#333333',
            radicalColor: '#333333',
            highlightColor: '#ff6161',
            outlineColor: '#222222',
            drawingColor: '#e53935',
            drawingWidth: 12,
            showHintAfterMisses: 1,
            showOutline: true
        };

        compWriter1 = HanziWriter.create('comp-writer-target-1', comp.word[0], hwOpts);
        compWriter2 = HanziWriter.create('comp-writer-target-2', comp.word[1], hwOpts);

        let cKey = `${currentCategory}_${currentIndex}_${currentSubStep}`;

        compWriter1.quiz({
            onComplete: function() {
                compChar1Done = true;
                let box1 = document.getElementById("box-char-1");
                if (box1) box1.classList.add("completed");
                checkCompoundBothDone(comp.word, cKey);
            }
        });

        compWriter2.quiz({
            onComplete: function() {
                compChar2Done = true;
                let box2 = document.getElementById("box-char-2");
                if (box2) box2.classList.add("completed");
                checkCompoundBothDone(comp.word, cKey);
            }
        });
    }

    // Render the 4-5 compound words directly underneath
    let compoundsHtml = "";
    if (item.compounds && item.compounds.length > 0) {
        item.compounds.forEach((c, idx) => {
            let isActive = (currentSubStep === idx + 1);
            let cKey = `${currentCategory}_${currentIndex}_${idx + 1}`;
            let isDone = !!completedSteps[cKey];
            let badgeText = isActive ? "Tracing Now" : (isDone ? "✓ Traced" : "Trace ➔");

            compoundsHtml += `
            <div class="compound-card ${isActive ? 'active-compound' : ''}" onclick="jumpPracticeStep(${idx + 1})">
                <div class="compound-word-wrapper">
                    <span class="compound-badge">${badgeText}</span>
                    <ruby class="compound-word">${escapeHtml(c.word)}<rt>${escapeHtml(c.reading)}</rt></ruby>
                </div>
                <div class="compound-meaning">${escapeHtml(c.meaning)}</div>
            </div>`;
        });
    }
    document.getElementById("pracCompoundsList").innerHTML = compoundsHtml;
}

function renderStepperState() {
    let item = currentList[currentIndex];
    let numCompounds = (item.compounds && item.compounds.length) || 0;
    let stepperHtml = "";
    let baseKey = `${currentCategory}_${currentIndex}_0`;
    let isBaseDone = !!completedSteps[baseKey];
    stepperHtml += `<div class="step-pill ${currentSubStep === 0 ? 'active' : ''} ${isBaseDone ? 'done' : ''}" onclick="jumpPracticeStep(0)">${item.char} (Base)</div>`;
    
    for (let i = 0; i < numCompounds; i++) {
        let c = item.compounds[i];
        let cKey = `${currentCategory}_${currentIndex}_${i + 1}`;
        let isDone = !!completedSteps[cKey];
        stepperHtml += `<div class="step-pill ${currentSubStep === (i + 1) ? 'active' : ''} ${isDone ? 'done' : ''}" onclick="jumpPracticeStep(${i + 1})">${i + 1}. ${c.word}</div>`;
    }
    document.getElementById("pracStepper").innerHTML = stepperHtml;
}

function checkCompoundBothDone(word, cKey) {
    let banner = document.getElementById("pracStatusBanner");
    if (compChar1Done && compChar2Done) {
        completedSteps[cKey] = true;
        if (banner) {
            banner.innerText = `Compound "${word}" Completed! ✨`;
            banner.className = "trace-status-banner success";
        }
        renderStepperState();
    } else if (compChar1Done) {
        if (banner) banner.innerText = `1st Kanji complete! Now trace 2nd Kanji.`;
    } else if (compChar2Done) {
        if (banner) banner.innerText = `2nd Kanji complete! Now trace 1st Kanji.`;
    }
}

function jumpPracticeStep(subStep) {
    currentSubStep = subStep;
    renderPractice();
}

function prevPractice() {
    if (currentSubStep > 0) {
        currentSubStep--;
    } else if (currentIndex > 0) {
        currentIndex--;
        let prevItem = currentList[currentIndex];
        currentSubStep = (prevItem.compounds && prevItem.compounds.length) || 0;
    }
    renderPractice();
}

function nextPractice() {
    let item = currentList[currentIndex];
    let numCompounds = (item.compounds && item.compounds.length) || 0;
    
    if (currentSubStep < numCompounds) {
        // Move to the compound word of the same kanji right after it!
        currentSubStep++;
    } else {
        // Finished all compounds for this kanji -> advance to next kanji base!
        currentIndex++;
        currentSubStep = 0;
        if (currentIndex >= currentList.length) {
            currentIndex = 0;
        }
    }
    renderPractice();
}

function animateStrokeOrder() {
    if (currentSubStep === 0) {
        if (baseWriter) {
            baseWriter.animateCharacter({
                onComplete: function() {
                    setTimeout(() => { if (baseWriter) baseWriter.quiz(); }, 800);
                }
            });
        }
    } else {
        if (compWriter1) {
            compWriter1.animateCharacter({
                onComplete: function() {
                    if (compWriter2) {
                        compWriter2.animateCharacter({
                            onComplete: function() {
                                setTimeout(() => {
                                    if (compWriter1 && !compChar1Done) compWriter1.quiz();
                                    if (compWriter2 && !compChar2Done) compWriter2.quiz();
                                }, 800);
                            }
                        });
                    }
                }
            });
        }
    }
}

// MCQ Mode Functions (Tests Compound Words)
function renderMCQ() {
    if (currentIndex >= currentList.length) currentIndex = 0;
    let item = currentList[currentIndex];
    
    // Randomly select one of the compound words belonging to the current kanji
    let comps = item.compounds;
    if (!comps || comps.length === 0) return;
    mcqCurrentCompound = comps[Math.floor(Math.random() * comps.length)];
    
    document.getElementById("mcqKanji").innerText = mcqCurrentCompound.word;
    document.getElementById("mcqFurigana").innerText = mcqCurrentCompound.reading;
    document.getElementById("mcqProgress").innerText = `Kanji ${currentIndex + 1} / ${currentList.length}`;
    
    // 4 multiple-choice options (1 correct, 3 distractors)
    let options = [mcqCurrentCompound.meaning];
    
    // Gather candidate distractors from current category's compounds first
    let catMeanings = [];
    currentList.forEach(k => {
        k.compounds.forEach(c => {
            if (c.meaning !== mcqCurrentCompound.meaning && !catMeanings.includes(c.meaning)) {
                catMeanings.push(c.meaning);
            }
        });
    });
    catMeanings.sort(() => 0.5 - Math.random());
    for (let m of catMeanings) {
        if (!options.includes(m)) {
            options.push(m);
            if (options.length === 4) break;
        }
    }
    
    // Fallback to global pool if needed
    if (options.length < 4) {
        let globalPool = [...allCompoundMeanings].sort(() => 0.5 - Math.random());
        for (let m of globalPool) {
            if (!options.includes(m)) {
                options.push(m);
                if (options.length === 4) break;
            }
        }
    }
    
    options.sort(() => 0.5 - Math.random());
    
    let optionsHtml = "";
    options.forEach((opt, idx) => {
        optionsHtml += `<label class="mcq-option" id="mcqLabel${idx}" onclick="selectMCQOption(${idx})">
            <input type="radio" name="mcqOption" value="${escapeHtml(opt)}" id="mcqOpt${idx}"> 
            <span>${escapeHtml(opt)}</span>
        </label>`;
    });
    
    document.getElementById("mcqOptions").innerHTML = optionsHtml;
    document.getElementById("mcqFeedback").innerText = "";
    document.getElementById("mcqFeedback").className = "feedback";
    
    let btn = document.getElementById("mcqSubmitBtn");
    btn.innerText = "Check Answer";
    btn.style.backgroundColor = "var(--red-accent)";
    mcqState = "answering";
}

function selectMCQOption(idx) {
    if (mcqState === "answered") return;
    document.querySelectorAll('#mcqOptions .mcq-option').forEach(el => el.classList.remove('selected'));
    let selectedLabel = document.getElementById(`mcqLabel${idx}`);
    if (selectedLabel) selectedLabel.classList.add('selected');
    let input = document.getElementById(`mcqOpt${idx}`);
    if (input) input.checked = true;
}

function checkMCQ() {
    if (mcqState === "answered") {
        currentIndex++;
        renderMCQ();
        return;
    }

    let selectedInput = document.querySelector('input[name="mcqOption"]:checked');
    let feedback = document.getElementById("mcqFeedback");
    
    if (!selectedInput) {
        feedback.innerText = "Please select an answer.";
        feedback.className = "feedback incorrect";
        return;
    }
    
    let isCorrect = (selectedInput.value === mcqCurrentCompound.meaning);
    let btn = document.getElementById("mcqSubmitBtn");

    document.querySelectorAll('#mcqOptions .mcq-option').forEach(el => {
        let input = el.querySelector('input');
        if (input.value === mcqCurrentCompound.meaning) {
            el.classList.add('correct-highlight');
        } else if (input.checked && !isCorrect) {
            el.classList.add('incorrect-highlight');
        }
    });

    if (isCorrect) {
        feedback.innerText = "Correct!";
        feedback.className = "feedback correct";
        btn.innerText = "Next Question ➔";
        btn.style.backgroundColor = "var(--green-correct)";
        mcqState = "answered";
    } else {
        feedback.innerText = `Incorrect. Correct answer: "${mcqCurrentCompound.meaning}"`;
        feedback.className = "feedback incorrect";
        btn.innerText = "Next Question ➔";
        btn.style.backgroundColor = "var(--red-accent)";
        mcqState = "answered";
    }
}

// 20-Word Randomized Test Functions (Pooled across all categories)
function startRandomTest() {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('practiceMode').classList.remove('active');
    document.getElementById('mcqMode').classList.remove('active');
    
    let testMode = document.getElementById('testMode');
    testMode.classList.add('active');
    
    // Pool all compound words across categories and generate a randomized 20-question test
    let shuffled = [...allCompoundsPool].sort(() => 0.5 - Math.random());
    testQuestions = shuffled.slice(0, 20);
    currentIndex = 0;
    testScore = 0;
    
    document.getElementById("testSubmitBtn").style.display = "block";
    renderTestQuestion();
}

function renderTestQuestion() {
    if (currentIndex >= 20 || currentIndex >= testQuestions.length) {
        endTest();
        return;
    }
    
    let item = testQuestions[currentIndex];
    
    document.getElementById("testKanji").innerText = item.word;
    document.getElementById("testFurigana").innerText = item.reading;
    document.getElementById("testProgress").innerText = `Question ${currentIndex + 1} / 20`;
    
    let options = [item.meaning];
    let pool = [...allCompoundMeanings].sort(() => 0.5 - Math.random());
    for (let m of pool) {
        if (!options.includes(m)) {
            options.push(m);
            if (options.length === 4) break;
        }
    }
    options.sort(() => 0.5 - Math.random());
    
    let optionsHtml = "";
    options.forEach((opt, idx) => {
        optionsHtml += `<label class="mcq-option" id="testLabel${idx}" onclick="selectTestOption(${idx})">
            <input type="radio" name="testOption" value="${escapeHtml(opt)}" id="testOpt${idx}"> 
            <span>${escapeHtml(opt)}</span>
        </label>`;
    });
    
    document.getElementById("testOptions").innerHTML = optionsHtml;
    document.getElementById("testFeedback").innerText = "";
    document.getElementById("testFeedback").className = "feedback";
    document.getElementById("testSubmitBtn").disabled = false;
}

function selectTestOption(idx) {
    document.querySelectorAll('#testOptions .mcq-option').forEach(el => el.classList.remove('selected'));
    let selectedLabel = document.getElementById(`testLabel${idx}`);
    if (selectedLabel) selectedLabel.classList.add('selected');
    let input = document.getElementById(`testOpt${idx}`);
    if (input) input.checked = true;
}

function checkTest() {
    let selectedInput = document.querySelector('input[name="testOption"]:checked');
    let feedback = document.getElementById("testFeedback");
    
    if (!selectedInput) {
        feedback.innerText = "Please select an answer.";
        feedback.className = "feedback incorrect";
        return;
    }
    
    let item = testQuestions[currentIndex];
    let isCorrect = (selectedInput.value === item.meaning);
    
    document.querySelectorAll('#testOptions .mcq-option').forEach(el => {
        let input = el.querySelector('input');
        if (input.value === item.meaning) {
            el.classList.add('correct-highlight');
        } else if (input.checked && !isCorrect) {
            el.classList.add('incorrect-highlight');
        }
    });
    
    if (isCorrect) {
        testScore++;
        feedback.innerText = "Correct!";
        feedback.className = "feedback correct";
    } else {
        feedback.innerText = `Incorrect. Correct was: "${item.meaning}"`;
        feedback.className = "feedback incorrect";
    }
    
    document.getElementById("testSubmitBtn").disabled = true;
    
    setTimeout(() => {
        currentIndex++;
        renderTestQuestion();
    }, 1600);
}

function endTest() {
    document.getElementById("testKanji").innerText = "完了"; 
    document.getElementById("testFurigana").innerText = "かんりょう";
    
    let percentage = Math.round((testScore / 20) * 100);
    document.getElementById("testProgress").innerText = `Final Score: ${testScore} / 20 (${percentage}%)`;
    
    let evaluation = percentage >= 90 ? "Excellent work! Kanji compound master!" : percentage >= 70 ? "Good job! Keep practicing." : "Needs more review. Keep practicing!";
    let scoreColor = percentage >= 70 ? "var(--green-correct)" : "var(--red-accent)";
    
    document.getElementById("testOptions").innerHTML = `
        <div style="text-align:center; padding: 15px 0;">
            <div style="font-size: 46px; font-weight: 700; color: ${scoreColor}; margin-bottom: 8px;">
                ${percentage}%
            </div>
            <h3 style="color:var(--text-main); font-size: 18px; margin-bottom: 22px;">${evaluation}</h3>
            <div style="display:flex; gap:12px; justify-content:center;">
                <button onclick="startRandomTest()" style="background-color: var(--red-accent);">Retake Test</button>
                <button onclick="setMode('practice')" style="background-color: #33333e;">Back to Practice</button>
            </div>
        </div>
    `;
    document.getElementById("testFeedback").innerText = "";
    document.getElementById("testSubmitBtn").style.display = "none";
}

// Initialize application
window.onload = () => {
    initDB();
    loadCategory("1");
};
</script>
